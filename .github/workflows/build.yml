name: Build Jade

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Jade with Xcode 27
    runs-on: macos-26

    steps:
      - name: Checkout Jade
        uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode_27_beta_4.app/Contents/Developer

      - name: Verify Xcode
        run: |
          echo "Developer directory:"
          xcode-select -p

          echo ""
          echo "Xcode version:"
          xcodebuild -version

      - name: Inspect Jade project
        run: |
          echo "===== Project format ====="
          grep -E 'objectVersion|LastUpgradeCheck' \
            Jade.xcodeproj/project.pbxproj

          echo ""
          echo "===== Xcode project ====="
          xcodebuild -list -project Jade.xcodeproj

      - name: Build Jade
        run: |
          xcodebuild \
            -project Jade.xcodeproj \
            -scheme Jade \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Check build output
        run: |
          echo "===== Build products ====="
          find build/Build/Products -maxdepth 3 -print

      - name: Create IPA
        run: |
          set -e

          APP_PATH="build/Build/Products/Release-iphoneos/Jade.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Jade.app was not found."
            find build/Build/Products -maxdepth 3 -print || true
            exit 1
          fi

          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/Jade.app

          zip -r Jade.ipa Payload

          echo ""
          echo "===== IPA ====="
          ls -lh Jade.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Jade-IPA
          path: Jade.ipa
          if-no-files-found: error
