name: Build Jade

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout Jade
        uses: actions/checkout@v4

      - name: List installed Xcodes
        run: |
          ls -la /Applications | grep Xcode || true

      - name: Show current Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: List project
        run: |
          xcodebuild -list -project Jade.xcodeproj

      - name: Build Jade
        run: |
          xcodebuild \
            -project Jade.xcodeproj \
            -scheme Jade \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Jade.app Payload/
          zip -r Jade.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Jade-IPA
          path: Jade.ipa
