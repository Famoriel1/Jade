name: Build Jade

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  inspect:
    name: Inspect Jade Project
    runs-on: macos-26

    steps:
      - name: Checkout Jade
        uses: actions/checkout@v4

      - name: List installed Xcodes
        run: |
          echo "Installed Xcode versions:"
          ls -la /Applications | grep Xcode || true

      - name: Show current Xcode
        run: |
          echo "Xcode version:"
          xcodebuild -version

          echo ""
          echo "Developer directory:"
          xcode-select -p

      - name: Inspect project format
        run: |
          echo "===== Project format information ====="

          if [ -f "Jade.xcodeproj/project.pbxproj" ]; then
            grep -E 'objectVersion|compatibilityVersion|LastUpgradeCheck' \
              Jade.xcodeproj/project.pbxproj | head -20
          else
            echo "ERROR: Jade.xcodeproj/project.pbxproj was not found"
            exit 1
          fi

          echo ""
          echo "===== First 20 lines of project.pbxproj ====="
          head -20 Jade.xcodeproj/project.pbxproj

          echo ""
          echo "===== Git commit ====="
          git log -1 --oneline

      - name: Try to list Xcode project
        run: |
          xcodebuild \
            -list \
            -project Jade.xcodeproj

  build:
    name: Build Jade
    needs: inspect
    runs-on: macos-26

    steps:
      - name: Checkout Jade
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: List project schemes
        run: |
          xcodebuild \
            -list \
            -project Jade.xcodeproj

      - name: Build Jade
        run: |
          xcodebuild \
            -project Jade.xcodeproj \
            -scheme Jade \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Check build output
        run: |
          echo "===== Build products ====="
          find build/Build/Products -maxdepth 2 -type d -print

      - name: Package IPA
        run: |
          set -e

          APP_PATH="build/Build/Products/Release-iphoneos/Jade.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Jade.app was not found."
            echo ""
            echo "Available build products:"
            find build/Build/Products -maxdepth 3 -print || true
            exit 1
          fi

          rm -rf Payload
          mkdir Payload

          cp -R "$APP_PATH" Payload/Jade.app

          zip -r Jade.ipa Payload

          echo ""
          echo "IPA created:"
          ls -lh Jade.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Jade-IPA
          path: Jade.ipa
          if-no-files-found: error
