name: Build Jade

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Jade with Xcode 27
    runs-on: xcode-27

    steps:
      - name: Checkout Jade
        uses: actions/checkout@v4

      - name: Verify Xcode
        run: |
          echo "===== Developer directory ====="
          xcode-select -p

          echo ""
          echo "===== Xcode version ====="
          xcodebuild -version

          echo ""
          echo "===== macOS version ====="
          sw_vers

      - name: Inspect Jade project
        run: |
          set -e

          echo "===== Project format ====="

          grep -E 'objectVersion|LastUpgradeCheck' \
            Jade.xcodeproj/project.pbxproj

          echo ""
          echo "===== Project information ====="

          xcodebuild \
            -list \
            -project Jade.xcodeproj

      - name: Build Jade
        run: |
          set -o pipefail

          xcodebuild \
            -project Jade.xcodeproj \
            -scheme Jade \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Check build output
        run: |
          set -e

          echo "===== Build products ====="

          find build/Build/Products \
            -maxdepth 3 \
            -print

          echo ""
          echo "===== Checking Jade.app ====="

          APP_PATH="build/Build/Products/Release-iphoneos/Jade.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Jade.app was not found."
            exit 1
          fi

          echo "Jade.app found:"
          ls -la "$APP_PATH"

      - name: Create IPA
        run: |
          set -e

          APP_PATH="build/Build/Products/Release-iphoneos/Jade.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Jade.app was not found."
            exit 1
          fi

          echo "===== Preparing IPA ====="

          rm -rf Payload
          rm -f Jade.ipa

          mkdir -p Payload

          cp -R "$APP_PATH" Payload/Jade.app

          echo ""
          echo "===== IPA directory structure ====="

          find Payload -maxdepth 2 -print

          echo ""
          echo "===== Creating Jade.ipa ====="

          cd Payload

          zip -r -X ../Jade.ipa Jade.app

          cd ..

          echo ""
          echo "===== IPA created ====="

          ls -lh Jade.ipa

          echo ""
          echo "===== IPA contents ====="

          unzip -l Jade.ipa

          echo ""
          echo "===== Verifying IPA structure ====="

          if ! unzip -l Jade.ipa | grep -q "Payload/Jade.app/"; then
            echo "ERROR: IPA does not contain Payload/Jade.app/"
            exit 1
          fi

          if ! unzip -l Jade.ipa | grep -q "Payload/Jade.app/Info.plist"; then
            echo "ERROR: IPA does not contain Jade.app/Info.plist"
            exit 1
          fi

          echo "IPA structure looks correct."

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Jade-IPA
          path: Jade.ipa
          if-no-files-found: error
