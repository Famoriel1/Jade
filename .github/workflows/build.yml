name: Build Jade

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Jade with Xcode 27
    runs-on: xcode-27

    steps:
      - name: Checkout Jade
        uses: actions/checkout@v4

      - name: Verify Xcode
        run: |
          echo "===== Developer directory ====="
          xcode-select -p

          echo ""
          echo "===== Xcode version ====="
          xcodebuild -version

          echo ""
          echo "===== macOS version ====="
          sw_vers

      - name: Inspect Jade project
        run: |
          set -e

          echo "===== Project format ====="

          grep -E 'objectVersion|LastUpgradeCheck' \
            Jade.xcodeproj/project.pbxproj

          echo ""
          echo "===== Project information ====="

          xcodebuild \
            -list \
            -project Jade.xcodeproj

      - name: Build Jade
        run: |
          set -o pipefail

          xcodebuild \
            -project Jade.xcodeproj \
            -scheme Jade \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Check build output
        run: |
          echo "===== Build products ====="

          find build/Build/Products \
            -maxdepth 3 \
            -print

      - name: Create unsigned IPA
        run: |
          set -e

          APP_PATH="build/Build/Products/Release-iphoneos/Jade.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Jade.app was not found."
            echo ""
            echo "Available build products:"
            find build/Build/Products \
              -maxdepth 4 \
              -print || true
            exit 1
          fi

          echo "Found Jade.app"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/Jade.app

          rm -f Jade.ipa

          cd Payload
          zip -r ../Jade.ipa Jade.app
          cd ..

          echo ""
          echo "===== IPA created ====="
          ls -lh Jade.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Jade-IPA
          path: Jade.ipa
          if-no-files-found: error
