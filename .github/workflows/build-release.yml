name: Build & Release IPA

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Build archive (unsigned)
        run: |
          xcodebuild archive \
            -project bad_query.xcodeproj \
            -scheme bad_query \
            -configuration Release \
            -archivePath build/bad_query.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Export IPA (unsigned)
        run: |
          mkdir -p build/output
          cat > build/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/bad_query.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/output \
            CODE_SIGNING_ALLOWED=NO

      - name: Rename IPA
        run: |
          VERSION=$(date +%Y%m%d-%H%M%S)
          cp build/output/*.ipa "BQTools-${VERSION}.ipa"
          echo "IPA_NAME=BQTools-${VERSION}.ipa" >> $GITHUB_ENV

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BQTools-IPA
          path: "*.ipa"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BQTools Build #${{ github.run_number }}
          body: |
            Auto-built from commit ${{ github.sha }}

            **Bundle ID:** com.jason.bqtools
            **Signature:** Unsigned — install via TrollStore or sign manually.
          files: "*.ipa"
          prerelease: true
